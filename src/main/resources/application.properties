# NordTafl â€” ConfiguraciÃ³n
# ============================================================

spring.application.name=nordtafl-backend

# ------------------------------------------------------------
# Base de datos
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nordtafl}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-init-sql=SET search_path TO auth, game, advisor, profile, public

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Redis
# ------------------------------------------------------------
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.ssl.enabled=false

# ------------------------------------------------------------
# Jackson
# ------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ------------------------------------------------------------
# App (custom)
# ------------------------------------------------------------
app.environment=${APP_ENV:dev}
app.jwt.secret=${JWT_SECRET:cambia-este-secret-en-produccion-minimo-32-caracteres}
app.jwt.access-expiration=900
app.jwt.refresh-expiration=604800
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.rp-name=NordTafl
app.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:8080}
app.google.client-id=${GOOGLE_CLIENT_ID:tu-client-id.apps.googleusercontent.com}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:demo}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo}
# ------------------------------------------------------------

# Alertas (opcional)
# ------------------------------------------------------------
app.alerts.email.enabled=false
app.alerts.email.to=tu-correo@gmail.com
app.alerts.telegram.enabled=false
app.alerts.telegram.bot-token=
app.alerts.telegram.chat-id=

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.com.nordtafl=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
app.name=NordTafl Backend
app.description=API del juego de Hnefatafl multijugador por turnos
app.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=true

# ------------------------------------------------------------
# Brevo SMTP (OTP + RecuperaciÃ³n)
# ------------------------------------------------------------
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USER:test@nordtafl.app}
spring.mail.password=${BREVO_SMTP_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.brevo.from-email=${BREVO_FROM_EMAIL:noreply@nordtafl.app}


