# Configuración de Test - Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS auth
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Redis y Mail apagados para no fallar
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false
management.health.mail.enabled=false

# Configuraciones requeridas por los Beans
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=test@nordtafl.app
spring.mail.password=test

app.jwt.secret=cambia-este-secret-en-produccion-minimo-32-caracteres
app.jwt.access-expiration=900
app.jwt.refresh-expiration=604800
app.webauthn.rp-id=localhost
app.webauthn.rp-name=NordTafl
app.webauthn.origin=http://localhost:8080
app.google.client-id=test-client-id
app.cloudinary.cloud-name=test
app.cloudinary.api-key=test
app.cloudinary.api-secret=test
app.environment=test